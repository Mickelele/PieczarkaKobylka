<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria | Pieczarka Kobyłka</title>
<meta name="description" content="Zdjęcia zapiekanek XXL, hot dogów, gofrów i lodów z Pieczarki w Kobyłce.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16110d">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="galeria">

<section class="page-hero">
  <div class="wrap">
    <span class="kicker">Galeria</span>
    <h1>Lepiej <span class="script">zobaczyć</span><br>niż czytać</h1>
    <p class="lead">Prawdziwe zdjęcia z naszej kuchni. Kliknij, żeby powiększyć.</p>
  </div>
</section>

<section class="paper">
  <div class="wrap">
    <div class="gallery">
      <button class="reveal" data-lightbox><img src="img/zapiekanka-szczypiorek.jpg" alt="Zapiekanka z sosem serowym, pomidorem i szczypiorkiem" loading="lazy"></button>
      <button class="reveal d1" data-lightbox><img src="img/flatlay.jpg" alt="Zapiekanka z jalapeño, gofr z owocami i kawa mrożona" loading="lazy"></button>
      <button class="reveal d2" data-lightbox><img src="img/hotdog.jpg" alt="Hot dog amerykański" loading="lazy"></button>
      <button class="reveal" data-lightbox><img src="img/zapiekanki-rukola.jpg" alt="Zapiekanki z rukolą, pomidorem i sosem czosnkowym" loading="lazy"></button>
      <button class="reveal d1" data-lightbox><img src="img/gofr.jpg" alt="Gofr z cukrem pudrem i czekoladą" loading="lazy"></button>
      <button class="reveal d2" data-lightbox><img src="img/zapiekanka-cebulka.jpg" alt="Zapiekanka z prażoną cebulką" loading="lazy"></button>
      <button class="reveal" data-lightbox><img src="img/shake.jpg" alt="Kawa mrożona z bitą śmietaną i sosem" loading="lazy"></button>
      <button class="reveal d1" data-lightbox><img src="img/lody.jpg" alt="Lody naturalne w waflu" loading="lazy"></button>
      <button class="reveal d2" data-lightbox><img src="img/zapiekanka-ogorek.jpg" alt="Zapiekanka z ogórkiem konserwowym i ketchupem" loading="lazy"></button>
    </div>
  </div>
</section>

<section class="cta-band">
  <div class="wrap">
    <div class="reveal">
      <h2>Zgłodniałeś?</h2>
      <p>Wpadnij na Zagańczyka 10. Otwarte codziennie od 11:00 do 21:30.</p>
    </div>
    <div class="acts reveal d1">
      <a class="btn btn-dark" href="menu.html">Zobacz menu</a>
      <a class="btn btn-ghost" href="https://www.facebook.com/PieczarkaKobylka" target="_blank" rel="noopener">Więcej na Facebooku</a>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
